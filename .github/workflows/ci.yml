name: Tests

on: [push, pull_request]

jobs:
  unit_tests:
    name: unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        rev: [nightly, v0.12.5]

    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.rev }}

      - uses: tree-sitter/setup-action/cli@v2

      - name: Run tests
        run: |
          nvim --headless -u scripts/minimal_init.lua -i NONE \
            -c "lua require('nvim-treesitter.install').install({'go'})" \
            -c "lua local p = vim.fs.joinpath(vim.fn.stdpath('data'), 'site', 'parser', 'go.so'); if not vim.wait(120000, function() return vim.fn.filereadable(p) == 1 end) then vim.cmd('cq') end" \
            -c "q"
          make test
